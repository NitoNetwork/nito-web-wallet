[package]
name = "nito-wallet-crypto-web"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "nito_wallet_crypto_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bip39 = { version = "2.2.0", features = ["zeroize"] }
bitcoin = { version = "0.32.7", features = ["base64", "serde"] }
hex = "0.4.3"
pbkdf2 = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
zeroize = "1.8.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values(any()))'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
