log_format nito_wallet_privacy '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                    'rt=$request_time ua="$http_user_agent"';

limit_req_zone $binary_remote_addr zone=nito_wallet:10m rate=30r/s;

map $upstream_http_content_security_policy $nito_wallet_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://electrum1.nito.network:50005 wss://electrum1.nitopool.fr:50005; worker-src 'self'; manifest-src 'self'; media-src 'none'; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name wallet.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://wallet.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wallet.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wallet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/nito-wallet.access.log nito_wallet_privacy;
    error_log /var/log/nginx/nito-wallet.error.log warn;

    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 15s;

    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-DNS-Prefetch-Control;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $nito_wallet_csp always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(?:bak|conf|env|key|lock|map|old|orig|pem|rs|save|sql|sqlite|toml|ts|tsx)$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        limit_req zone=nito_wallet burst=120 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }
}
