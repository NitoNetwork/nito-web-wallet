server {
    listen 80;
    server_name wallet.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        return 503;
    }
}
